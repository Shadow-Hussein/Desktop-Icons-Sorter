name: Release

# Push a version tag (e.g. `v0.3.0`, matching Cargo.toml) to build the
# Windows installer + portable exe and publish them as a GitHub release.
# Release notes list the commit subjects since the previous tag.
# PRs that touch packaging run the same build without publishing.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - installer/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, so release notes can list commits since the last tag.
          fetch-depth: 0
      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2

      - name: Read the version from Cargo.toml
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - run: cargo test
      - run: cargo build --release

      - name: Build installer and portable exe
        shell: bash
        run: |
          v='${{ steps.version.outputs.version }}'
          mkdir -p dist
          # The exe is a single file that runs from anywhere, so it doubles as the portable build.
          cp target/release/desktop-icons-sorter.exe "dist/desktop-icons-sorter-$v-portable.exe"
          makensis=$(command -v makensis || echo '/c/Program Files (x86)/NSIS/makensis.exe')
          if [ ! -x "$makensis" ]; then choco install nsis -y --no-progress; fi
          "$makensis" -V2 "-DVERSION=$v" "-DOUTFILE=..\\dist\\desktop-icons-sorter-$v-setup.exe" installer/installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-icons-sorter-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      # Work lands on main directly, so notes come from commits, not merged PRs.
      # Also runs on PR/manual builds (against HEAD) as a preview of the next notes.
      - name: Write release notes from commits
        shell: bash
        run: |
          ref=HEAD
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then ref="$GITHUB_REF_NAME"; fi
          node scripts/release-notes.mjs "$ref" | tee release-notes.md

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          body_path: release-notes.md
