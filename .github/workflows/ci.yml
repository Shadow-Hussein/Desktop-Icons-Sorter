name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Check the Win32 bindings load
        run: node -e "const k=require('koffi'); const u=k.load('user32.dll'); console.log('Progman', u.func('intptr_t __stdcall FindWindowW(const char16_t *c, const char16_t *n)')('Progman', null))"
      - name: Package (unpacked)
        run: npm run dist:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-icons-sorter-win-unpacked
          path: dist/win-unpacked
          retention-days: 7
