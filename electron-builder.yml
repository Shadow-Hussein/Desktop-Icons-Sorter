appId: com.shadowhussein.desktopiconssorter
productName: Desktop Icons Sorter
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/koffi/**
win:
  # Used for the app exe, the installer, the uninstaller and shortcuts.
  # Regenerate with `python3 build/make-icon.py`.
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
# The installer and the portable app are both .exe files, so they need distinct names.
portable:
  artifactName: ${name}-${version}-portable.${ext}
# koffi ships prebuilt N-API binaries, so no native rebuild (or build tools) is needed.
npmRebuild: false
